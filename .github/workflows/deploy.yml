name: Update data, build and deploy

on:
  schedule:
    - cron: "0 21 1 * *" # 00:00 TLV time on the first day of every month
  workflow_dispatch:
    inputs:
      full_reindex:
        description: "Replace the whole Algolia index (removes stale records). Set to 1 to enable."
        required: false
        default: ""
      prefix:
        description: "URL path prefix for a preview build (e.g. /HaaretzMusafim). Leave empty for production."
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID || secrets.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY || secrets.ALGOLIA_SEARCH_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape data and update Algolia
        if: github.event_name != 'push'
        env:
          ALGOLIA_APP_KEY: ${{ secrets.ALGOLIA_APP_KEY }}
          ALGOLIA_FULL_REINDEX: ${{ github.event.inputs.full_reindex }}
        run: python haaretz_scrape.py

      - name: Commit and push data changes
        if: github.event_name != 'push'
        run: |
          git config user.email "ChefAharoni@proton.me"
          git config user.name "ChefAharoni"
          git add data/*
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto updated magazines URLs via Script on $(date)"
            git push
          fi

      - name: Build static site
        env:
          PREFIX: ${{ github.event.inputs.prefix }}
        run: python build_static.py --prefix "$PREFIX"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Open issue on scheduled-run failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Monthly data update failed ($(date +%Y-%m-%d))" \
            --body "The scheduled run failed: $RUN_URL"
